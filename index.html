<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaultVision</title>
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100vh; padding: 48px 24px 80px; }
  h1 { text-align: center; font-size: 2.6em; margin: 0 0 8px; letter-spacing: 4px;
    background: linear-gradient(90deg, #ff2d95, #b23bff, #34e0ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px #b23bff77); }
  .sub { text-align: center; opacity: .6; margin: 0 0 56px; font-size: .95em; }
  h2 { max-width: 1100px; margin: 0 auto 20px; padding-left: 4px;
    font-size: 1.3em; letter-spacing: 2px; color: #ff6fc7;
    border-bottom: 1px solid #b23bff40; padding-bottom: 8px; }
  /* .no-snap: while an arrow button is held, mandatory snap fights the tiny
     per-frame scrollLeft writes (it keeps trying to snap back to the nearest
     card), which made the hold-to-scroll silently do nothing */
  .row.no-snap { scroll-snap-type: none; }
  .row { max-width: 1100px; margin: 0 auto 56px; display: flex; gap: 20px;
    overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px;
    scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  a.card { position: relative; flex: 0 0 240px; scroll-snap-align: start; display: block;
    padding: 18px 16px; border: 1px solid #b23bff40;
    border-radius: 6px; color: #e8def8; text-decoration: none;
    background: linear-gradient(180deg, #21123f88, #0a0618 80%);
    transition: border-color .15s, background .15s, transform .1s; }
  a.card:hover { border-color: #34e0ff; background: linear-gradient(180deg, #33195eaa, #0d0a1c);
    transform: translateY(-2px); }
  a.card.tv-focus { border-color: #ff2d95; background: linear-gradient(180deg, #33195eaa, #0d0a1c);
    transform: translateY(-2px); outline: 3px solid #ff2d95; outline-offset: 3px;
    box-shadow: 0 0 22px #ff2d9566; }
  a.card:focus { outline: none; }
  a.card .art { height: auto; aspect-ratio: 2 / 3; margin: -18px -16px 12px; display: flex;
    align-items: center; justify-content: center; overflow: hidden;
    background: #eee; border-bottom: 1px solid #b23bff40; border-radius: 6px 6px 0 0; }
  a.card .art img { max-width: 100%; max-height: 100%; object-fit: contain; }
  a.card .name { display: block; font-size: 1.08em; line-height: 1.3; }
  a.card .count { display: block; margin-top: 8px; font-size: .8em; opacity: .55; color: #34e0ff; }
  a.card.resume::after { content: '▶ RESUME'; position: absolute; top: 8px; right: 8px;
    font-size: .65em; letter-spacing: 1px; background: #ff2d95; color: #0a0618;
    padding: 2px 6px; border-radius: 3px; }

  /* Favorites: a plus in the free top-left corner (RESUME's ribbon owns
     top-right) that flips to a check when toggled on. In search results the
     card is a horizontal row instead, so it drops out of the corner and
     becomes a normal flex child pinned to the right via margin-left: auto. */
  a.card .fav { position: absolute; top: 8px; left: 8px; width: 26px; height: 26px;
    display: grid; place-items: center; border-radius: 50%; z-index: 3;
    border: 1px solid #b23bff40; background: #0a0618cc; color: #e8def8;
    cursor: pointer; font: inherit; font-size: 1em; line-height: 1; padding: 0; }
  a.card .fav::before { content: '+'; }
  a.card .fav:hover { border-color: #34e0ff; color: #34e0ff; }
  a.card .fav[aria-pressed="true"] { background: #ff2d95; border-color: #ff2d95; color: #0a0618; }
  a.card .fav[aria-pressed="true"]::before { content: '✓'; }
  #search-results a.card .fav { position: static; margin-left: auto; }
  .row-wrap { position: relative; max-width: 1100px; margin: 0 auto 56px; }
  .row-wrap .row { margin: 0; } /* the wrapper now owns the centering/spacing */
  /* A small circle centered on the row, not a full-height hover strip — the
     old edge-to-edge gradient's hover/hit zone overlapped the top-left
     Favorites button on each row's first card, and the two fighting for
     :hover as the pointer crossed the boundary made the "+" strobe. */
  .row-arrow { position: absolute; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: 50%; z-index: 2;
    border: 1px solid #b23bff40; cursor: pointer; font-size: 1.4em; color: #e8def8;
    background: #0a0618cc; opacity: 0; transition: opacity .15s;
    display: flex; align-items: center; justify-content: center; }
  .row-wrap:hover .row-arrow { opacity: 1; }
  .row-arrow:hover { color: #34e0ff; border-color: #34e0ff; }
  .row-arrow.left { left: 8px; }
  .row-arrow.right { right: 8px; }

  /* right edge tracks the grid's own right edge (rows are max-width:1100px,
     centered inside body's 24px side padding) instead of the viewport edge,
     so the icon never sits further right than the tiles below it. */
  #search-wrap { position: fixed; top: 20px; right: max(24px, calc(50vw - 550px)); z-index: 10; }
  #search-toggle { width: 40px; height: 40px; padding: 0; display: grid; place-items: center;
    border-radius: 50%; color: #e8def8; background: #1c0f3a; border: 1px solid #b23bff40;
    cursor: pointer; }
  #search-toggle:hover, #search-toggle:focus { border-color: #34e0ff; color: #34e0ff; outline: none; }
  #search-wrap.open #search-toggle { display: none; }
  #search-box { display: none; width: 240px; font: inherit; font-size: .95em; letter-spacing: 1px;
    color: #e8def8; background: #1c0f3a; border: 1px solid #b23bff40;
    border-radius: 6px; padding: 10px 14px; }
  #search-wrap.open #search-box { display: block; }
  #search-box::placeholder { color: #e8def888; }
  #search-box:focus { outline: none; border-color: #34e0ff; }
  #search-results { position: absolute; top: calc(100% + 6px); right: 0; z-index: 5;
    width: min(300px, calc(100vw - 40px)); max-height: 70vh; overflow-y: auto;
    background: #0d0a1cf5; border: 1px solid #b23bff40;
    border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  #search-results[hidden] { display: none; } /* [hidden]'s UA display:none loses to the ID rule above without this */
  #search-results a.card { display: flex; flex: 0 0 auto; flex-direction: row; align-items: center;
    gap: 12px; padding: 8px; background: none; border: none; }
  #search-results a.card:hover, #search-results a.card:focus,
  #search-results a.card.tv-focus { background: #21123f; outline: 2px solid #ff2d95;
    transform: none; }
  #search-results a.card .art { width: 40px; height: 60px; margin: 0; flex: 0 0 auto;
    aspect-ratio: auto; border-radius: 3px; border: none; }
  #search-results a.card .count { display: none; }
  #search-results .empty { padding: 10px; opacity: .6; text-align: center; }

  /* Mobile: hover-revealed arrows don't work on touch, and small landscape
     thumbnails read poorly on a phone — go bigger with portrait art instead.
     Desktop layout above is untouched. */
  @media (max-width: 720px) {
    body { padding-top: 20px; }
    h1 { font-size: 1.7em; margin-bottom: 4px; }
    .sub { margin-bottom: 24px; }
    .row-arrow { display: none; }
    h2 { font-size: 1.3em; margin-bottom: 10px; padding-bottom: 6px; }
    .row-wrap { margin-bottom: 26px; }
    a.card { flex-basis: 33vw; padding: 12px 10px; }
    a.card .art { height: auto; aspect-ratio: 2 / 3; margin: -12px -10px 8px; }
    a.card .name { font-size: 1.05em; }
    a.card .count { font-size: .8em; }
    #search-wrap { top: 14px; }
    #search-box { width: 190px; }
    #search-results { max-height: 60vh; }
  }
</style>
<h1>VaultVision</h1>
<p class="sub">pick something to watch — every title streams straight from archive.org</p>

<div id="search-wrap">
  <button id="search-toggle" type="button" aria-label="Search shows" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
  </button>
  <input id="search-box" type="search" placeholder="Search shows…" autocomplete="off" aria-label="Search shows">
  <div id="search-results" hidden></div>
</div>

<div id="favorites-section" style="display:none">
  <h2>Favorites</h2>
  <div class="row" id="favorites-row"></div>
</div>

<div id="resume-section" style="display:none">
  <h2>Resume <span style="opacity:.5; font-weight:normal;">— pick up where you left off</span></h2>
  <div class="row" id="resume-row"></div>
</div>

<div id="guide"></div>


<script type="module">
  // The guide used to be ~300 hand-written <a class="card"> entries baked
  // into this file. Now it's rendered from shows.js (window.SHOWS_CSV: title,
  // folder id, genre, art extension — one line per show) so adding a show
  // never means hand-editing HTML. Loaded as a <script> rather than fetched as
  // plain shows.csv so the guide still works opened directly as a file:// URL
  // — fetch() of a local file is blocked by Chrome's CORS policy even for a
  // same-directory file, but a <script src> load isn't (same reason show.html
  // pulls in each show's data.js the same way). Everything below this
  // (Favorites, Resume, search, row-arrows, tv.js) depends on the cards
  // already existing in the DOM, so it all waits on this render first via
  // top-level await.

  // Fixed structural chrome, not per-show data — same order as the old
  // hand-written <h2> headers. The Broadcast Blocks note explains why those
  // shows aren't sorted into a "real" genre above instead.
  const GENRES = [
    ['Animation', null],
    ['Sitcoms', null],
    ['Drama & Adventure', null],
    ['Horror & Anthology', null],
    ['Sketch Comedy & Late Night', null],
    ['Kids & Educational', null],
    ['Reality TV', null],
    ['TV Movies', null],
    ['Broadcast Blocks', 'mixed-genre recordings, not sorted above'],
  ];

  // Minimal RFC 4180 CSV parser: handles quoted fields, embedded commas, and
  // doubled-quote escaping ("" -> "). A naive split(',') breaks on titles
  // like "Bakersfield, P.D." or "Eerie, Indiana".
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
        else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
      } else field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  // Alphabetical, ignoring a leading "the"/"a"/"an" — matches the sort the
  // guide already used when it was hand-maintained (see ADDING_A_SHOW.md).
  function sortKey(title) { return title.replace(/^(the|a|an)\s+/i, '').toLowerCase(); }

  async function renderGuide() {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'shows.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('shows.js failed to load'));
      document.head.append(s);
    });
    const byGenre = new Map();
    for (const [title, id, genre, ext] of parseCSV(window.SHOWS_CSV)) {
      if (!byGenre.has(genre)) byGenre.set(genre, []);
      byGenre.get(genre).push({ title, id, ext });
    }
    for (const shows of byGenre.values()) shows.sort((a, b) => sortKey(a.title).localeCompare(sortKey(b.title)));

    const guide = document.getElementById('guide');
    for (const [genre, note] of GENRES) {
      const shows = byGenre.get(genre);
      if (!shows || !shows.length) continue;
      const h2 = document.createElement('h2');
      h2.append(genre);
      if (note) {
        const span = document.createElement('span');
        span.style.cssText = 'opacity:.5; font-weight:normal;';
        span.textContent = ' — ' + note;
        h2.append(span);
      }
      guide.append(h2);
      const row = document.createElement('div');
      row.className = 'row';
      for (const s of shows) {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = `engine/viewer.html?show=${encodeURIComponent(s.id)}`;
        const art = document.createElement('span');
        art.className = 'art';
        const img = document.createElement('img');
        img.src = `art/${s.id}.${s.ext}`;
        img.alt = '';
        art.append(img);
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = s.title;
        a.append(art, name);
        row.append(a);
      }
      guide.append(row);
    }
  }
  await renderGuide();

  // tv.js's keyboard nav bails out at load if it finds zero cards, so it's
  // loaded here (after the guide exists) instead of as a static <script> tag.
  await new Promise(resolve => {
    const s = document.createElement('script');
    s.src = 'tv.js';
    s.onload = resolve;
    document.body.append(s);
  });

  // Favorites: whole shows only (no per-episode granularity), persisted as a
  // set of show ids in localStorage. The "+" gets appended to every card here,
  // before the Resume-row clone step below, so a cloneNode(true) picks up a
  // working button for free — same reason it later shows up on search-result
  // cards, which are also just clones of these same nodes.
  const FAV_KEY = 'vv-favorites';
  let favorites;
  try { favorites = new Set(JSON.parse(localStorage.getItem(FAV_KEY)) || []); } catch { favorites = new Set(); }

  function getShowId(card) {
    try { return new URL(card.href, location.href).searchParams.get('show'); } catch { return null; }
  }

  for (const c of document.querySelectorAll('a.card')) {
    const id = getShowId(c);
    if (!id) continue;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'fav';
    btn.setAttribute('aria-label', 'Toggle favorite');
    btn.setAttribute('aria-pressed', String(favorites.has(id)));
    c.appendChild(btn);
  }

  // Rebuilds from scratch off the live Set rather than patching in/out a
  // single card — simplest way to keep it de-duped and in one consistent
  // order without tracking per-id DOM references.
  function rebuildFavoritesRow() {
    const row = document.getElementById('favorites-row');
    const section = document.getElementById('favorites-section');
    row.innerHTML = '';
    if (!favorites.size) { section.style.display = 'none'; return; }
    const seen = new Set();
    for (const c of document.querySelectorAll('.row:not(#resume-row):not(#favorites-row) a.card')) {
      const id = getShowId(c);
      if (!id || !favorites.has(id) || seen.has(id)) continue;
      seen.add(id);
      row.appendChild(c.cloneNode(true));
    }
    section.style.display = '';
  }

  document.addEventListener('click', function (e) {
    const btn = e.target.closest('.fav');
    if (!btn) return;
    e.preventDefault(); // it's nested in an <a> — don't navigate to the show
    const id = getShowId(btn.closest('a.card'));
    if (!id) return;
    if (favorites.has(id)) favorites.delete(id); else favorites.add(id);
    localStorage.setItem(FAV_KEY, JSON.stringify([...favorites]));
    const pressed = favorites.has(id);
    for (const b of document.querySelectorAll('a.card .fav'))
      if (getShowId(b.closest('a.card')) === id) b.setAttribute('aria-pressed', String(pressed));
    rebuildFavoritesRow();
  });

  // Resume row: the 5 most recently-touched in-progress shows (any saved
  // episode position counts — this is "get back into it quicker", not a
  // binge-tracker). Cards link straight to the viewer, which already reopens
  // at the saved episode/time — no separate "next episode" logic needed here.
  (function () {
    const seen = new Set(), resumes = [];
    for (const c of document.querySelectorAll('a.card[href*="show="]')) {
      const id = new URL(c.href, location.href).searchParams.get('show');
      if (!id || seen.has(id)) continue;
      seen.add(id);
      let p;
      try { p = JSON.parse(localStorage[id.toLowerCase() + '-progress']); } catch { continue; }
      if (!p) continue;
      // no watched-episode history behind it (not "in progress" via a real
      // streak) and barely into the current episode — likely just a stray
      // click, not a real resume candidate
      if (!p.w?.length && (p.t || 0) < 5) continue;
      resumes.push({ ts: p.ts || 0, card: c });
    }
    resumes.sort((a, b) => b.ts - a.ts);
    const top = resumes.slice(0, 5);
    if (!top.length) return;
    const row = document.getElementById('resume-row');
    for (const r of top) {
      const clone = r.card.cloneNode(true);
      clone.classList.add('resume');
      row.appendChild(clone);
    }
    document.getElementById('resume-section').style.display = '';
  })();

  // Browsing a category goes to the show info screen first (title, resume/play,
  // episode list); Resume row cards skip straight to the player — that's the
  // whole point of Resume. Runs after the resume clones above so it only
  // touches the genre-grid originals, not the (already-linked) clones.
  for (const c of document.querySelectorAll('a.card[href*="engine/viewer.html?show="]:not(.resume)')) {
    const id = new URL(c.href, location.href).searchParams.get('show');
    c.href = `show.html?show=${encodeURIComponent(id)}`;
  }

  // Mouse-friendly scroll arrows: horizontal wheel/trackpad scrolling isn't
  // discoverable with a plain mouse, so give each row hover-revealed « »
  // buttons at its edges. Built once per .row here instead of duplicating
  // wrapper markup across all 9 rows by hand.
  for (const row of document.querySelectorAll('.row')) {
    const wrap = document.createElement('div');
    wrap.className = 'row-wrap';
    row.parentNode.insertBefore(wrap, row);
    wrap.appendChild(row);
    for (const dir of ['left', 'right']) {
      const btn = document.createElement('button');
      btn.className = 'row-arrow ' + dir;
      btn.type = 'button';
      btn.setAttribute('aria-label', dir === 'left' ? 'Scroll left' : 'Scroll right');
      btn.textContent = dir === 'left' ? '‹' : '›';
      // press-and-hold to scroll, release to stop (Netflix-style) rather than
      // a page-jump per click; ramps up the longer it's held, same curve as
      // the video player's hold-to-seek. requestAnimationFrame with real
      // delta-time so both the pace and the ramp hold steady across frame rates.
      const mul = dir === 'left' ? -1 : 1, basePxPerSec = 260;
      let raf = null, last = 0, holdStart = 0;
      const step = now => {
        const accel = 1 + Math.max(0, (now - holdStart) / 1000) * 2;
        row.scrollLeft += mul * basePxPerSec * accel * (now - last) / 1000;
        last = now;
        raf = requestAnimationFrame(step);
      };
      btn.addEventListener('pointerdown', e => {
        btn.setPointerCapture(e.pointerId); // keeps pointerup firing even if the cursor drifts off the button
        row.classList.add('no-snap');
        last = holdStart = performance.now();
        raf = requestAnimationFrame(step);
      });
      const stop = () => { cancelAnimationFrame(raf); raf = null; row.classList.remove('no-snap'); };
      btn.addEventListener('pointerup', stop);
      btn.addEventListener('pointercancel', stop);
      wrap.appendChild(btn);
    }
  }

  // Cache-buster: GitHub Pages serves show.html/viewer.html with
  // Cache-Control: max-age=600, and both are reached by a link-navigation
  // (not a reload), so the browser can serve a stale copy for up to 10
  // minutes after a deploy. One token per page load forces a fresh fetch
  // without re-fetching on every click within a visit.
  const bust = Date.now().toString(36);
  for (const a of document.querySelectorAll('a.card[href*="show.html"], a.card[href*="viewer.html"]'))
    a.href += '&v=' + bust;

  // Mobile-only: prefer the taller portrait art (art/<Id>-tall.<ext>) if one
  // was generated for that show; falls back to the existing image otherwise.
  // Runs after the href rewiring above so ?art= still points at the regular
  // (landscape) file show.html expects.
  //
  // The tall variant's extension doesn't always match its base poster's (e.g.
  // base art/Foo.png, tall art/Foo-tall.jpg — different export passes), so
  // guessing "same extension as the base" 404s for those and silently falls
  // back to landscape. Try the base extension first (right most of the time),
  // then every other extension actually in use in art/, before giving up.
  if (matchMedia('(max-width: 720px)').matches) {
    const TALL_EXTS = ['jpg', 'png', 'webp', 'gif', 'svg'];
    for (const img of document.querySelectorAll('a.card .art img')) {
      const original = img.getAttribute('src');
      const stem = original.replace(/\.[^.\/]+$/, '');
      const baseExt = original.slice(stem.length + 1);
      const candidates = [baseExt, ...TALL_EXTS.filter(e => e !== baseExt)];
      let i = 0;
      const tryNext = () => {
        if (i >= candidates.length) { img.onerror = null; img.src = original; return; }
        img.src = `${stem}-tall.${candidates[i++]}`;
      };
      img.onerror = tryNext;
      tryNext();
    }
  }

  // Initial Favorites row build: deferred to here (rather than up where the
  // "+" buttons are wired) so it clones cards that already have their final
  // show.html href (+ cache-bust token) and any swapped mobile art.
  rebuildFavoritesRow();

  // Live search: the genre grid already has every show's name/art/href baked
  // into its cards, so that's the search index too — no separate data fetch.
  // Runs last so results link to show.html (+ cache-bust token) like the grid.
  (function () {
    const wrap = document.getElementById('search-wrap');
    const toggle = document.getElementById('search-toggle');
    const box = document.getElementById('search-box');
    const results = document.getElementById('search-results');
    const entries = [].slice.call(document.querySelectorAll('.row:not(#resume-row):not(#favorites-row) a.card')).map(function (c) {
      return { name: c.querySelector('.name').textContent, card: c };
    });

    function close() { results.hidden = true; results.innerHTML = ''; }

    // Icon-only until clicked, so it doesn't compete with the guide for space.
    function collapse() {
      wrap.classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
      box.value = '';
      close();
    }
    toggle.addEventListener('click', function () {
      wrap.classList.add('open');
      toggle.setAttribute('aria-expanded', 'true');
      box.focus();
    });
    // Covers both tabbing away and clicking outside: either moves focus off
    // the widget entirely, which a plain document click listener wouldn't
    // catch for keyboard users.
    wrap.addEventListener('focusout', function (e) {
      if (!wrap.contains(e.relatedTarget)) collapse();
    });

    // iOS Safari doesn't reliably report `relatedTarget` on a touch-driven
    // blur of a non-form element like a result card, so a tap there read as
    // "focus left the widget" above — collapse() then wiped the dropdown's
    // DOM before the tap's own click (opening the show, or the "+" toggle)
    // had run, so it looked like the tap registered (focus ring flashes)
    // and then did nothing. Blocking mousedown's default keeps the box
    // focused through the whole tap, so focusout never fires until after
    // the click has actually landed.
    results.addEventListener('mousedown', function (e) { e.preventDefault(); });

    box.addEventListener('input', function () {
      const q = box.value.trim().toLowerCase();
      results.innerHTML = '';
      if (!q) { close(); return; }
      const matches = entries.filter(function (e) { return e.name.toLowerCase().includes(q); }).slice(0, 20); // ponytail: soft cap, keeps the dropdown from growing past the screen
      if (!matches.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No matches';
        results.appendChild(empty);
      } else {
        matches.forEach(function (e) { results.appendChild(e.card.cloneNode(true)); });
      }
      results.hidden = false;
    });

    box.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && !results.hidden) {
        const first = results.querySelector('a.card');
        if (first) { e.preventDefault(); first.focus(); }
      } else if (e.key === 'Escape') {
        collapse();
        toggle.focus();
      }
    });

    results.addEventListener('keydown', function (e) {
      const items = [].slice.call(results.querySelectorAll('a.card'));
      const i = items.indexOf(document.activeElement);
      if (i === -1) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (i < items.length - 1) items[i + 1].focus();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (i === 0) box.focus(); else items[i - 1].focus();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        collapse();
        toggle.focus();
      }
    });
  })();
</script>
